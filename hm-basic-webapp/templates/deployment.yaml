apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hm-basic-webapp.prefix" . }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ include "hm-basic-webapp.prefix" . }}
  template:
    metadata:
      labels:
        app: {{ include "hm-basic-webapp.prefix" . }}
        app.kubernetes.io/managed-by: {{.Release.Service }}
        app.kubernetes.io/instance: {{.Release.Name }}
      annotations:
        date: {{ now }}
    spec:
      imagePullSecrets:
        {{- .Values.imagePullSecrets | toYaml | nindent 8 }}
      containers:
        - image: "{{ .Values.image.repository }}:{{ .Values.ci.deploymentTag | default .Chart.AppVersion }}"
          name: {{ include "hm-basic-webapp.prefix" . }}
          ports:
            - containerPort: {{ .Values.servicePort }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: K8S_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          envFrom:
          {{- $configName := include "hm-basic-webapp.configName" . -}}
          {{- if $configName }}
            - configMapRef:
                name: {{ $configName }}
          {{- end }}
          {{- if .Values.secretName }}
            - secretRef:
                name: {{ .Values.secretName }}
          {{- end }}

          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
